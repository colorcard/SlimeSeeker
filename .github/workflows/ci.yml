# 跨平台持续集成入口：原生测试、arm64 交叉编译、Sanitizer 与 CUDA 编译验证。
name: ci

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DSLIMESEEKER_ENABLE_CUDA=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix stage
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: slimeseeker-${{ runner.os }}-${{ runner.arch }}
          path: stage/
          if-no-files-found: error

  linux-arm64-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu
      - name: Configure
        run: >-
          cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          -DSLIMESEEKER_ENABLE_CUDA=OFF
          -DSLIMESEEKER_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-arm64 --parallel
      - name: Install
        run: cmake --install build-arm64 --prefix stage-arm64
      - name: Upload Linux arm64 package
        uses: actions/upload-artifact@v4
        with:
          name: slimeseeker-Linux-ARM64
          path: stage-arm64/
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DSLIMESEEKER_ENABLE_CUDA=OFF
          -DSLIMESEEKER_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cuda-compile:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake g++ git ninja-build
      - uses: actions/checkout@v4
      - name: Configure CUDA backend
        run: >-
          cmake -S . -B build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DSLIMESEEKER_ENABLE_CUDA=ON
          -DSLIMESEEKER_BUILD_BENCHMARKS=OFF
      - name: Verify CUDA source selection
        shell: bash
        run: |
          grep -q 'src/backends/cuda.cu' build-cuda/build.ninja
          ! grep -q 'src/backends/cuda_stub.cpp' build-cuda/build.ninja
      - name: Build CUDA backend
        run: cmake --build build-cuda --parallel
      - name: Test without GPU device
        run: ctest --test-dir build-cuda --output-on-failure
